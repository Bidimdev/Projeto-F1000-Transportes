<h1>Clientes</h1>
<p>Gerencie os clientes cadastrados no sistema F1000.</p>

<div class="cartao_clientes">
    <h2>Pesquisa, filtros e registros</h2>
    <table>
        <thead>                            <!--define o cabeçalho.-->
            <tr>                         <!--cria uma linha.-->
                <th scope="col">Nome / Razão Social</th>               <!--cria uma célula de título.-->
                <th scope="col">CNPJ</th>
                <th scope="col">Contato</th>
                <th scope="col">Cidade</th>
                <th scope="col">Status</th>             <!--scop ="col" indica que o título se refere a uma coluna. -->
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>maria silva</td>               <!--td cria uma celula comum-->
                <td>12.345.678/0001-90</td>
                <td>(31) 99999-8888</td>
                <td>Belo Horizonte - MG</td>
                <td><span class="status_ativo">Ativo</span></td>
            </tr>
            <tr>
                <td>Carlos Souza</td>
                <td>23.456.789/0001-10</td>
                <td>(31) 98888-7777</td>
                <td>Betim - MG</td>
                <td><span class="status_inativo">inativo</span></td>
            </tr>
        </tbody>
    </table>
</div>
